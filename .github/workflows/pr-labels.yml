name: Copy issue labels to PR

# Copies the labels of the issue a PR closes (wocs, level, ui, ...) onto the PR.
# pull_request_target can label PRs from forks. It never checks out the PR's
# code, so nothing from the fork runs here.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  issues: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // A manual run labels every open PR, for PRs opened before this workflow existed.
            const pulls = context.payload.pull_request
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });

            // "Closes #7", "Fixes #7", "Resolves #7", and the older "Issue: #7".
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|issue:?)\s+#(\d+)/gi;

            for (const pull of pulls) {
              if (pull.user.type === "Bot") continue;

              const numbers = [...new Set([...(pull.body || "").matchAll(pattern)].map((m) => Number(m[1])))];
              const have = new Set(pull.labels.map((label) => label.name));
              // If a maintainer already set a level on the PR, keep it instead of adding the issue's.
              const hasLevel = [...have].some((name) => name.startsWith("level "));
              const add = new Set();

              for (const number of numbers) {
                let issue;
                try {
                  ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
                } catch {
                  continue; // No such issue in this repo.
                }
                if (issue.pull_request) continue; // It's a PR, not an issue.

                for (const label of issue.labels) {
                  const name = typeof label === "string" ? label : label.name;
                  if (hasLevel && name.startsWith("level ")) continue;
                  if (!have.has(name)) add.add(name);
                }
              }

              if (add.size === 0) continue;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull.number,
                labels: [...add],
              });
              core.info(`#${pull.number}: added ${[...add].join(", ")}`);
            }
